[package]
name = "ome-zarr-pyramid"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ome_zarr_pyramid in Rust: OME-Zarr images, their multiscales and coordinate transformations, read on zarrs and dyna-zarr's crates (Workplan DR9)"

[dependencies]
# metadata keys read straight from the store (zarr.json, .zattrs), local or in a zip;
# the same zarrs as dyna-zarr's arrays crate
zarrs = { version = "0.23", features = ["zlib"] }
zarrs_zip = "0.5"
serde_json = "1"
# dyna-zarr's crates: ozp depends on dyna, never the reverse. From dyna's repository,
# pinned to a commit of its main (DR7 merged, PR #26), until they are published.
dyna-zarr-transforms = { git = "https://github.com/bugraoezdemir/dyna_zarr", rev = "8699f9b34a5bee5e550e7c436b65cf9de6aa99f7" }
dyna-zarr-arrays = { git = "https://github.com/bugraoezdemir/dyna_zarr", rev = "8699f9b34a5bee5e550e7c436b65cf9de6aa99f7" }
