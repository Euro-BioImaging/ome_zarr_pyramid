[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ome_zarr_pyramid"
version = "0.0.9"
description = "Read, write and downscale OME-Zarr (NGFF) pyramids with a lazy, memory-bound Pyramid object"
readme = "README.md"
# 3.11+: the codebase uses PEP 604 (`str | None`) annotations at runtime, and the
# optional dyna backend needs dyna-zarr, which is 3.11+.
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Bugra Oezdemir", email = "bugraa.ozdemir@gmail.com"},
]
keywords = [
    "ome-zarr", "ome", "ngff", "zarr", "pyramid", "multiscale", "image-pyramid",
    "bioimage", "bioimaging", "microscopy", "image-processing",
    "dask", "tensorstore", "out-of-core", "lazy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Every one of these is imported at MODULE LOAD, so the package is unimportable without
# it. They were missing until a clean-venv install check caught them: a dev environment
# happened to provide them, so both the test suite and `twine check` stayed green while
# `pip install ome_zarr_pyramid` produced something that raised ModuleNotFoundError on
# `import`.
dependencies = [
    "zarr",
    "tensorstore",
    "numpy",
    "numcodecs",          # utils/compressor_config.py, core/pyramid.py (codec configs)
    "pydantic>=2",        # utils/compressor_config.py (ConfigDict/field_validator = v2)
    # the arrays a Pyramid works on without dask: zarr / numpy / TensorStore levels
    # wrapped as DynamicArray (indexing, operators, statistics, the dyna write path).
    # 0.0.7: numpy + TensorStore wrapping, ufuncs, stack, tuple-axis reductions.
    # 0.0.9: the write engine - io.write(dimension_names=), io.create_sink (the dask
    # pump), TensorStore sources keeping their chunks / codecs / shards.
    "dyna-zarr>=0.0.9",
]

[project.optional-dependencies]
# Object stores (s3://, gs://, az://) through the dyna engine: obstore opens the NGFF
# group with the same storage_options names dyna uses for the arrays.
remote = ["obstore>=0.11"]
# The LEGACY https://<endpoint>/<bucket>/<key> form (s3fs options, 'sync' engine).
s3 = ["s3fs"]
# dask is optional: dask-backed pyramids (`Pyramid.from_array(dask_array)`), their
# `dask_arrays` views, and dask-graph rechunking. Everything else runs without it
# (DynamicArray / TensorStore); imported only where used (utils/optional_deps.py).
dask = ["dask"]
# Kept for compatibility: dyna-zarr is a required dependency now.
dyna = []
dev = [
    "pytest>=7.0",
    # The suite exercises the dask paths too; CI also runs it WITHOUT dask installed.
    "dask",
    # tests/test_write_remote.py: an in-process S3 emulator + the remote extra
    "moto[server]>=5",
    "obstore>=0.11",
]

[project.urls]
Homepage = "https://github.com/Euro-BioImaging/ome_zarr_pyramid"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]
